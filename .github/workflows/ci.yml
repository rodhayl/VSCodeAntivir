name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: xvfb-run -a npm run test:integration

      - name: Synthetic characterization
        run: node ./test/benchmark.js > benchmark.json

      - name: Build VSIX
        run: npm run package

      - name: Verify packaged runtime
        run: npm run verify:package

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: fakeinterviewguard-${{ github.sha }}
          path: |
            extension/*.vsix
            extension/out/build-metadata.json
            extension/benchmark.json
          if-no-files-found: error
